<svg width="180px" height="50px" viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#006B5E"/>
            <stop offset="100%" stop-color="#00897B"/>
        </linearGradient>
    </defs>

    <!-- Icon/Logo Mark -->
    <g transform="translate(0, 5)">
        <!-- Location/Map Pin Style -->
        <circle cx="20" cy="20" r="18" fill="url(#primaryGrad)" opacity="0.15"/>
        <circle cx="20" cy="20" r="14" fill="url(#primaryGrad)" opacity="0.3"/>
        <circle cx="20" cy="20" r="10" fill="url(#primaryGrad)"/>

        <!-- Inner "N" letter -->
        <path d="M15 14 L15 26 L20 20 L25 26 L25 14" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text: Nearby -->
    <text x="44" y="32" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a2e" letter-spacing="0.5">
        Nearby
    </text>

    <!-- Text: Fundi -->
    <text x="108" y="32" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#006B5E" letter-spacing="0.5">
        Fundi
    </text>
</svg>