name: netsaf_fund_app
description: "NETSAF FUND APP – connect with trusted technicians, manage services, posts, portfolio and requests."
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.0
  toastification: ^2.1.0
  font_awesome_flutter: ^11.0.0

  # Media & Files
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  emoji_picker_flutter: ^4.4.0
  file_picker: ^8.1.4
  open_file: ^4.0.0
  path_provider: ^2.1.6
  gallery_saver_plus: ^3.2.9
  pdf: ^3.10.7
  printing: ^5.11.0
  share_plus: ^11.0.0

  # YouTube (thumbnail + open externally)
  youtube_player_flutter: ^9.1.1
  url_launcher: ^6.3.0

  # State & Network
  provider: ^6.0.5
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  flutter_cache_manager: ^3.4.1

  # Firebase & Notifications
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^19.4.1

  # Device Features
  geolocator: ^13.0.2
  permission_handler: ^12.0.3
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/netsaf.png"
  adaptive_icon_background: "#006B5E"
  adaptive_icon_foreground: "assets/icons/netsaf.png"