name: fundiapp
description: Technician app for NearbyFundi – manage services, posts, portfolio and requests.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.0
  toastification: ^2.1.0
  font_awesome_flutter: ^11.0.0

  # State Management & Networking
  provider: ^6.0.5
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  http: ^1.3.0
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^19.4.1

  # Image & File
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  open_file: ^4.0.0
  file_picker: ^12.0.0-beta.7
  path_provider: ^2.1.6

  # Location
  geolocator: ^14.0.3
  permission_handler: ^12.0.3

  # Chat – (removed Pusher)
  flutter_cache_manager: ^3.4.1

  # Audio
  record: ^7.1.1
  audioplayers: ^6.8.1

  # Emoji
  emoji_picker_flutter: ^4.4.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Connectivity
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/backimg.jpg
    - assets/images/home.jpg
    - assets/images/nearbyfundi_image.jpg
    - assets/icons/nearbylogo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/nearbylogo.png"
  adaptive_icon_background: "#006B5E"
  adaptive_icon_foreground: "assets/icons/nearbylogo.png"
  min_sdk_android: 21