name: nearbyfundi
description: Customer app for NearbyFundi – request services, see fundi posts.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.0
  toastification: ^2.1.0
  flutter_svg: ^2.0.9
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Localization
  intl: ^0.20.2

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  logger: ^2.4.0
  web_socket_channel: ^3.0.2

  # Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.6

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0
  file_picker: ^10.3.10

  # Firebase
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^19.4.1

  # Device & Utilities
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # Chat
  socket_io_client: ^3.1.6
  flutter_sound: ^9.30.0
  open_file: ^3.3.2
  flutter_cache_manager: ^3.4.1

  # Icons
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/backimg.jpg
    - assets/images/home.jpg
    - assets/images/nearbyfundi_image.jpg
    - assets/icons/nearbylogo.png
    - assets/icons/chat/chat_icon.svg
    - assets/icons/chat/audio_icon.svg
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/nearbylogo.png"
  adaptive_icon_background: "#006B5E"
  adaptive_icon_foreground: "assets/icons/nearbylogo.png"
  min_sdk_android: 21